    .claude-note { border-left-style: dashed; }

    .src { font-size: var(--text-xs); color: var(--color-text-muted); font-family: var(--font-mono); }
    .formula-symbol { color: var(--color-accent-hover); font-weight: 600; }
    .cell-check { color: var(--color-success); }
    .cell-partial { color: var(--color-error); }
    button { color: var(--color-text); font-family: inherit; }
    .quiz-option { color: var(--color-text); }
    :root { color-scheme: light; }
    body { background: var(--color-bg); color: var(--color-text); }
